
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Admin Login | Blessing Pharma</title>

    <link rel="stylesheet" href="admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="login-wrapper">

        <section class="login-card">

            <div class="logo-container">
                <img src="img/logo.png"
                     alt="Blessing Pharma Logo">
            </div>

            <div class="login-heading">
                <span class="eyebrow">ADMINISTRATION PORTAL</span>

                <h1>Welcome <span>Back!</span></h1>

                <p>
                    Sign in to manage Blessing Pharma
                    product availability.
                </p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Administrator Email</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="username"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Show password">

                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <p id="errorMessage" class="error-message" role="alert"></p>

                <button type="submit" class="login-button">
                    Sign In
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <div class="login-footer">
                <i class="fa-solid fa-shield-halved"></i>
                Authorized Administrator Access Only
            </div>

        </section>

        <p class="copyright">
            &copy; <span id="currentYear"></span>
            Blessing Pharma and Medical Supplies Trading.
            All Rights Reserved.
        </p>

    </main>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="login.js"></script>

</body>
</html>
